id: LG-MCP-CREDENTIAL-IN-ENV
name: Raw credential in MCP env block
severity: high
category: credentials
description: MCP configuration env block contains a raw token or credential-like value instead of an environment reference.
references:
  - https://modelcontextprotocol.io
fix: Replace raw credential values with environment variable references such as ${GITHUB_PAT}.
score_impact: -15
