id: LG-CREDENTIAL-ENV-IN-CONTEXT-01
name: Tool function reads env-var credentials inline
severity: medium
category: permissions
description: Inline environment credential reads can leak secrets into model context.
references:
  - https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/
fix: Resolve credentials outside model-visible tool context and pass only opaque handles.
score_impact: -5
