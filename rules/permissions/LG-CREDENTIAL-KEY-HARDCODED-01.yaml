id: LG-CREDENTIAL-KEY-HARDCODED-01
name: Hardcoded API key detected in agent code
severity: high
category: permissions
description: A credential-like literal appears in agent code.
references:
  - https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/
fix: Move the key to a secret manager and rotate the exposed credential.
score_impact: -15
